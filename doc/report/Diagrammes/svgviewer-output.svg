<svg width="100%" viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Diagramme de cas d'utilisation - Ex-Libris</title>
<desc>Diagramme UML montrant les acteurs Visiteur et Utilisateur authentifie et leurs cas d'utilisation, organises par fonctionnalite F1 a F5, FO1 et FOX.</desc>
<defs>
<style>

text { font-family: Arial, Helvetica, sans-serif; fill:#2c2c2a; }

.t14 { font-size:14px; }

.t12 { font-size:12px; }

.t11 { font-size:11px; }

.bold { font-weight:bold; }

.pkg-label { font-size:13px; font-weight:bold; }
</style>
<marker id="gen" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="16" markerHeight="16" orient="auto-start-reverse">
<path d="M2 2L18 10L2 18Z" fill="white" stroke="#444441" stroke-width="1.2" stroke-linejoin="round"/>
</marker>
<marker id="dep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
 
<!-- System boundary -->
<rect x="220" y="60" width="1150" height="760" rx="10" fill="none" stroke="#444441" stroke-width="1.2"/>
<text class="t14 bold" x="240" y="85">Systeme Ex-Libris (API)</text>
 
<!-- Association lines (drawn first, behind ovals) -->
<g stroke="#9a9990" stroke-width="0.9" opacity="0.75">
<line x1="140" y1="150" x2="285" y2="160"/>
<line x1="140" y1="150" x2="285" y2="215"/>
<line x1="140" y1="535" x2="275" y2="280"/>
<line x1="140" y1="535" x2="620" y2="215"/>
<line x1="140" y1="535" x2="985" y2="155"/>
<line x1="140" y1="535" x2="985" y2="225"/>
<line x1="140" y1="535" x2="1000" y2="290"/>
<line x1="140" y1="535" x2="275" y2="430"/>
<line x1="140" y1="535" x2="260" y2="500"/>
<line x1="140" y1="535" x2="615" y2="470"/>
<line x1="140" y1="535" x2="1015" y2="430"/>
<line x1="140" y1="535" x2="985" y2="500"/>
<line x1="140" y1="535" x2="260" y2="700"/>
</g>
 
<!-- Actor: Visiteur -->
<g>
<circle cx="100" cy="100" r="10" fill="none" stroke="#2c2c2a" stroke-width="1.3"/>
<line x1="100" y1="110" x2="100" y2="155" stroke="#2c2c2a" stroke-width="1.3"/>
<line x1="82" y1="125" x2="118" y2="125" stroke="#2c2c2a" stroke-width="1.3"/>
<line x1="100" y1="155" x2="85" y2="190" stroke="#2c2c2a" stroke-width="1.3"/>
<line x1="100" y1="155" x2="115" y2="190" stroke="#2c2c2a" stroke-width="1.3"/>
<text class="t14 bold" x="100" y="212" text-anchor="middle">Visiteur</text>
</g>
 
<!-- Actor: Utilisateur -->
<g>
<circle cx="100" cy="480" r="10" fill="none" stroke="#2c2c2a" stroke-width="1.3"/>
<line x1="100" y1="490" x2="100" y2="535" stroke="#2c2c2a" stroke-width="1.3"/>
<line x1="82" y1="505" x2="118" y2="505" stroke="#2c2c2a" stroke-width="1.3"/>
<line x1="100" y1="535" x2="85" y2="570" stroke="#2c2c2a" stroke-width="1.3"/>
<line x1="100" y1="535" x2="115" y2="570" stroke="#2c2c2a" stroke-width="1.3"/>
<text class="t14 bold" x="100" y="592" text-anchor="middle">Utilisateur</text>
<text class="t11" x="100" y="608" text-anchor="middle">(authentifie)</text>
</g>
 
<!-- Generalization: Utilisateur -|> Visiteur -->
<line x1="100" y1="470" x2="100" y2="215" stroke="#2c2c2a" stroke-width="1.2" marker-end="url(#gen)"/>
 
<!-- Package F1 -->
<rect x="250" y="105" width="330" height="225" rx="6" fill="none" stroke="#7f77dd" stroke-width="1" stroke-dasharray="5 4"/>
<text class="pkg-label" x="264" y="128" fill="#3c3489">F1 - Compte utilisateur</text>
<ellipse cx="415" cy="160" rx="130" ry="24" fill="#eeedfe" stroke="#7f77dd" stroke-width="1"/>
<text class="t14" x="415" y="160" text-anchor="middle" dominant-baseline="central" fill="#3c3489">S'authentifier</text>
<ellipse cx="415" cy="215" rx="130" ry="24" fill="#eeedfe" stroke="#7f77dd" stroke-width="1"/>
<text class="t14" x="415" y="215" text-anchor="middle" dominant-baseline="central" fill="#3c3489">Creer un compte</text>
<ellipse cx="415" cy="280" rx="140" ry="30" fill="#eeedfe" stroke="#7f77dd" stroke-width="1"/>
<text class="t14" x="415" y="272" text-anchor="middle" dominant-baseline="central" fill="#3c3489">Mettre a jour le profil</text>
<text class="t12" x="415" y="291" text-anchor="middle" dominant-baseline="central" fill="#534ab7">(bio, infos)</text>
 
<!-- Package F2 -->
<rect x="610" y="105" width="330" height="225" rx="6" fill="none" stroke="#5dcaa5" stroke-width="1" stroke-dasharray="5 4"/>
<text class="pkg-label" x="624" y="128" fill="#085041">F2 - Recherche &amp; consultation</text>
<ellipse cx="775" cy="215" rx="150" ry="30" fill="#e1f5ee" stroke="#5dcaa5" stroke-width="1"/>
<text class="t14" x="775" y="207" text-anchor="middle" dominant-baseline="central" fill="#085041">Consulter une fiche livre</text>
<text class="t12" x="775" y="226" text-anchor="middle" dominant-baseline="central" fill="#0f6e56">(recherche + detail)</text>
 
<!-- Package F3 -->
<rect x="970" y="105" width="380" height="225" rx="6" fill="none" stroke="#f0997b" stroke-width="1" stroke-dasharray="5 4"/>
<text class="pkg-label" x="984" y="128" fill="#712b13">F3 - Bibliotheque personnelle</text>
<ellipse cx="1160" cy="155" rx="170" ry="28" fill="#faece7" stroke="#f0997b" stroke-width="1"/>
<text class="t14" x="1160" y="148" text-anchor="middle" dominant-baseline="central" fill="#712b13">Ajouter un livre a sa</text>
<text class="t12" x="1160" y="166" text-anchor="middle" dominant-baseline="central" fill="#993c1d">bibliotheque</text>
<ellipse cx="1160" cy="225" rx="170" ry="28" fill="#faece7" stroke="#f0997b" stroke-width="1"/>
<text class="t14" x="1160" y="218" text-anchor="middle" dominant-baseline="central" fill="#712b13">Mettre a jour statut,</text>
<text class="t12" x="1160" y="236" text-anchor="middle" dominant-baseline="central" fill="#993c1d">note, date de lecture</text>
<ellipse cx="1160" cy="290" rx="160" ry="24" fill="#faece7" stroke="#f0997b" stroke-width="1"/>
<text class="t14" x="1160" y="290" text-anchor="middle" dominant-baseline="central" fill="#712b13">Consulter sa bibliotheque</text>
 
<!-- Package F4 -->
<rect x="250" y="365" width="330" height="225" rx="6" fill="none" stroke="#ed93b1" stroke-width="1" stroke-dasharray="5 4"/>
<text class="pkg-label" x="264" y="388" fill="#72243e">F4 - Critiques</text>
<ellipse cx="415" cy="430" rx="130" ry="24" fill="#fbeaf0" stroke="#ed93b1" stroke-width="1"/>
<text class="t14" x="415" y="430" text-anchor="middle" dominant-baseline="central" fill="#72243e">Rediger une critique</text>
<ellipse cx="415" cy="500" rx="150" ry="30" fill="#fbeaf0" stroke="#ed93b1" stroke-width="1"/>
<text class="t14" x="415" y="492" text-anchor="middle" dominant-baseline="central" fill="#72243e">Consulter les critiques</text>
<text class="t12" x="415" y="511" text-anchor="middle" dominant-baseline="central" fill="#993556">d'un livre</text>
 
<!-- Package F5 -->
<rect x="610" y="365" width="330" height="225" rx="6" fill="none" stroke="#ef9f27" stroke-width="1" stroke-dasharray="5 4"/>
<text class="pkg-label" x="624" y="388" fill="#633806">F5 - Recommandation (au choix : F5B)</text>
<ellipse cx="775" cy="470" rx="155" ry="30" fill="#faeeda" stroke="#ef9f27" stroke-width="1"/>
<text class="t14" x="775" y="462" text-anchor="middle" dominant-baseline="central" fill="#633806">Visualiser des</text>
<text class="t12" x="775" y="481" text-anchor="middle" dominant-baseline="central" fill="#854f0b">recommandations</text>
 
<!-- Package FO1 -->
<rect x="970" y="365" width="380" height="225" rx="6" fill="none" stroke="#97c459" stroke-width="1" stroke-dasharray="5 4"/>
<text class="pkg-label" x="984" y="388" fill="#27500a">FO1 - Dimension sociale (optionnel)</text>
<ellipse cx="1160" cy="430" rx="150" ry="24" fill="#eaf3de" stroke="#97c459" stroke-width="1"/>
<text class="t14" x="1160" y="430" text-anchor="middle" dominant-baseline="central" fill="#27500a">Suivre un utilisateur</text>
<ellipse cx="1160" cy="500" rx="170" ry="30" fill="#eaf3de" stroke="#97c459" stroke-width="1"/>
<text class="t14" x="1160" y="492" text-anchor="middle" dominant-baseline="central" fill="#27500a">Consulter les critiques</text>
<text class="t12" x="1160" y="511" text-anchor="middle" dominant-baseline="central" fill="#3b6d11">d'un utilisateur</text>
 
<!-- Package FOX -->
<rect x="250" y="630" width="330" height="150" rx="6" fill="none" stroke="#b4b2a9" stroke-width="1" stroke-dasharray="5 4"/>
<text class="pkg-label" x="264" y="653" fill="#444441">FOX - Interactions sur critiques (optionnel)</text>
<ellipse cx="415" cy="700" rx="150" ry="30" fill="#f1efe8" stroke="#b4b2a9" stroke-width="1"/>
<text class="t14" x="415" y="692" text-anchor="middle" dominant-baseline="central" fill="#444441">Liker / disliker</text>
<text class="t12" x="415" y="711" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a">une critique</text>
 
<!-- include/extend relationships -->
<path d="M1060 175 L875 197" fill="none" stroke="#5f5e5a" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#dep)"/>
<text class="t11" x="960" y="180" text-anchor="middle" fill="#5f5e5a">&#171;include&#187;</text>
 
<line x1="415" y1="670" x2="415" y2="532" stroke="#5f5e5a" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#dep)"/>
<text class="t11" x="465" y="605" text-anchor="middle" fill="#5f5e5a">&#171;extend&#187;</text>
 
<!-- Legend -->
<rect x="970" y="650" width="350" height="115" rx="6" fill="none" stroke="#888780" stroke-width="1"/>
<text class="t12 bold" x="985" y="670">Legende</text>
<line x1="985" y1="690" x2="1030" y2="690" stroke="#9a9990" stroke-width="0.9"/>
<text class="t11" x="1040" y="694">Association acteur / cas d'usage</text>
<line x1="985" y1="712" x2="1030" y2="712" stroke="#5f5e5a" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#dep)"/>
<text class="t11" x="1040" y="716">&#171;include&#187; / &#171;extend&#187;</text>
<line x1="985" y1="734" x2="1030" y2="734" stroke="#2c2c2a" stroke-width="1.2" marker-end="url(#gen)"/>
<text class="t11" x="1040" y="730">Generalisation : Utilisateur</text>
<text class="t11" x="1040" y="744">herite de Visiteur</text>
 
</svg>
 